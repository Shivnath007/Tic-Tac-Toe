<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Tic Tac Toe</h1>

        <div class="scoreboard">
            <div class="player-score">
                <span>Player X</span>
                <strong id="x-score">0</strong>
            </div>

            <div class="player-score">
                <span>Piayer O</span>
                <strong id="o-score">0</strong>
            </div>
        </div>

        <p class="status">Player x's Turn</p>

        <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <button class="restart-btn">New Round</button>

    </div>
    <script src="script.js"></script>

</body>

</html>
