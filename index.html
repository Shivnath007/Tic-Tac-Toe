    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

            <div class="cell"></div>
            <div class="cell"></div>

        <button class="restart-btn">Restart Game</button>

    </div>

</body>

</html>
